    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash: apply persisted theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexus-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- index.html — replace the <body> section (from <div id="root"> to </html>) with this: -->
  <body>
    <div id="root"></div>
    <div
      id="boot-error"
      style="display:none; position:fixed; inset:0; z-index:99999; background:#fff; color:#b91c1c; font:13px/1.5 monospace; padding:16px; overflow:auto; white-space:pre-wrap;"
    ></div>
    <script>
      (function () {
        var box = document.getElementById('boot-error');
        function show(msg) {
          box.style.display = 'block';
          box.textContent += msg + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show('ERROR: ' + (e.message || e) + (e.filename ? '\nat ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('PROMISE REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && box.style.display === 'none') {
            show('App did not render within 4s and no JS error was caught (possible network/script-load failure).');
          }
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
